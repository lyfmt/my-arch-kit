<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twin Anchors</title>
<link rel="stylesheet" href="../../shared/p3.css">
<link rel="stylesheet" href="bar.css">
</head>
<body>
<div class="bg" id="desk"><img src="../../../p3-miku/bg.png" alt=""></div>

<div id="strip"></div>

<div class="plate" id="L">
  <div class="pin">
    <div class="ws" id="ws"><div class="wedge" id="wedge"><i class="e"></i><i class="w"></i><b class="d" id="wdig"></b></div></div>
    <div class="app d" id="app"></div>
  </div>
</div>

<div class="plate" id="R">
  <div class="pin">
    <div class="ur" id="ur"><i></i><b class="d" id="urn"></b></div>
    <div class="bat" id="bat"><span class="n d" id="batn"></span><span class="u d">%</span></div>
    <div class="gl" id="gl"></div>
    <div class="tm d" id="time"></div>
    <div class="dt d" id="date"></div>
  </div>
</div>

<div class="drop" id="LPd"><div class="sheet lp" id="LP"></div></div>
<div class="drop" id="RPd"><div class="sheet rp" id="RP"></div></div>
<div class="toasts" id="toasts"></div>
<div class="drop osd" id="osd"><div class="sheet"><span class="og" id="og"></span><i class="ob"><i id="obv"></i></i><b class="d ov" id="ov"></b></div></div>

<script src="bar.js"></script>
</body>
</html>
