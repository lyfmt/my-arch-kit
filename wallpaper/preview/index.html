<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>P3 Wallpaper Overlay</title>
<style>
@font-face{font-family:"P3";src:url("../../p5-reference/p3-menu/fonts/pe0RMImSLYBIv1o4X1M8cce4OdVisMz5nZRqy6cmmmU3t3NeCAAFOvV9FtjrwlNwjM6W3Y6K5co2d-laLQ.woff2") format("woff2");font-weight:900;font-style:italic}
@font-face{font-family:"P3";src:url("../../p5-reference/p3-menu/fonts/pe0RMImSLYBIv1o4X1M8cce4OdVisMz5nZRqy6cmmmU3t3NeCAAFOvV9FtjrwlNwjM6W3Y6K5co2d-daLY50.woff2") format("woff2");font-weight:900;font-style:italic;unicode-range:U+0100-02BA,U+2020,U+20A0-20AB,U+2113}
@font-face{font-family:"BarlowC";src:url("../../p5-reference/save-carousel/fonts/BarlowCondensed-Bold.ttf") format("truetype");font-weight:700}
/* P3 tokens only. --red is reserved for delete/danger. */
:root{
  --ink:#04103c;--tx:#ecfcff;--fill:#a3f0ff;--c1:#a1eefd;--c2:#90e1f2;--c3:#7ccdf4;--c4:#c2f6ff;--c5:#74c9ff;
  --dim:rgba(163,240,255,.62);--line:rgba(163,240,255,.22);--panel:rgba(2,10,60,.55);--well:rgba(163,240,255,.10);--red:#e3121b;
  --cut:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%);
  --e-out:cubic-bezier(.16,1,.3,1);
  --u:1px;--W:800px;--H:500px;--barH:2.4vw;
  --fd:"P3","Noto Sans CJK SC","Noto Sans CJK JP","Noto Sans Symbols 2","Noto Color Emoji",sans-serif;
  --fb:"BarlowC","Noto Sans CJK SC","Noto Sans CJK JP",sans-serif;
  --fz:"Noto Sans CJK SC","Noto Sans CJK JP","Source Han Sans SC",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--tx);font-family:var(--fz);font-weight:700;user-select:none;-webkit-user-select:none}

/* ---- FAKE DESKTOP (not part of the UI): applied wallpaper + real bar screenshot ---- */
#desk{position:fixed;inset:0;z-index:0;pointer-events:none}
#desk .dk{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
#desk .barw{position:absolute;left:0;top:0;width:100%;height:var(--barH);overflow:hidden;z-index:3}
#desk #bar{position:absolute;left:0;top:0;width:100%;height:auto;display:block}
#desk .tag{position:absolute;left:12px;bottom:10px;z-index:3;font:500 11px/1.3 monospace;letter-spacing:.06em;color:rgba(255,255,255,.75);background:rgba(0,0,0,.45);padding:3px 7px}

/* ---- OVERLAY: transparent layer-shell surface, no backdrop ---- */
#ov{position:fixed;inset:0;z-index:1}
#ov.closed{pointer-events:none}
#stage{position:absolute;inset:0;z-index:1}
/* cards are bottom-aligned on a tilted axis (tide layout) */
.card{position:absolute;left:0;top:0;width:var(--W);height:var(--H);margin:calc(var(--H)*-1) 0 0 calc(var(--W)/-2);transform-origin:50% 100%;
  will-change:transform,opacity;visibility:hidden;cursor:pointer}
.card>div{position:absolute}
/* ===== EDGE TREATMENT ===== the only place that decides how a card's edge looks. Variants edit this block only.
   Applies to every card (.card) and to the apply clone (#apply .im), so both always match.
   --isx/--isy are set per frame by JS (= 1/scaleX, 1/scaleY of the element), so lengths multiplied by them stay
   constant in SCREEN px even though cards are non-uniformly scaled; --ek (1 -> 0) is set on the apply clone only
   and fades the edge treatment out as the clone grows to full screen.
   Shape = --edge-r (rounded rect) and/or --edge-clip (polygon). Layers, back to front:
     .gl  contact shadow (radial gradient, not shape-matched)    .sh  floor shadow (blurred bar under the card)
     .ds  drop shadow: blurred copy of the card shape (.ds i), --edge-sh*, deepens on the selected card
     .fc  the face: image + tint/dim/blur/delete overlays, clipped to the shape
     .ln  optional edge line drawn inside the shape (--edge-line, transparent = off) */
.card,#apply .im{
  --edge-r:14px;                       /* corner radius, screen px (0 = square) */
  --edge-clip:none;                    /* e.g. polygon(0 0,calc(100% - 16px*var(--isx,1)) 0,100% calc(16px*var(--isy,1)),100% 100%,0 100%) */
  --edge-line:transparent;             /* inner hairline colour */
  --edge-line-w:1px;                   /* hairline width, screen px */
  --edge-sh:rgba(0,4,28,.62);          /* drop shadow colour */
  --edge-sh-blur:26px;                 /* drop shadow blur (card-local px) */
  --edge-sh-y:16px;                    /* drop shadow offset, grows by --edge-sh-lift on the selected card */
  --edge-sh-lift:12px;
  --edge-sh-spread:-2%;                /* inset/outset of the shadow shape vs the card */
  --ek:1}
.card .ds i,.card .fc,.card .ln,#apply .im{
  border-radius:calc(var(--edge-r)*var(--ek)*var(--isx,1)) / calc(var(--edge-r)*var(--ek)*var(--isy,1));clip-path:var(--edge-clip)}
.card .ds{inset:0;opacity:0;filter:blur(var(--edge-sh-blur));transform:translateY(calc(var(--edge-sh-y) + var(--edge-sh-lift)*var(--sel,0)))}
.card .ds i{position:absolute;inset:calc(var(--edge-sh-spread)*-1);background:var(--edge-sh)}
.card .ln{inset:0;pointer-events:none;box-shadow:inset 0 0 0 calc(var(--edge-line-w)*var(--isx,1)) var(--edge-line)}
#apply .im{box-shadow:0 calc((var(--edge-sh-y) + var(--edge-sh-lift))*var(--ek)*var(--isy,1)) calc(var(--edge-sh-blur)*2*var(--ek)*var(--isx,1)) var(--edge-sh)}  /* matches .ds on the hero; fades with --ek */
/* ===== /EDGE TREATMENT ===== */
.card .gl{inset:-14% -10% -22%;background:radial-gradient(closest-side,rgba(0,8,40,.75),transparent);opacity:0}   /* contact shadow */
.card .sh{left:5%;right:5%;bottom:-5%;height:22%;background:#000;filter:blur(34px);opacity:0}                       /* soft floor shadow */
.card .fc{inset:0;overflow:hidden;background:var(--ink)}
.fc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transform-origin:50% 50%}
.fc .b{opacity:0;filter:blur(8px)}
.fc .tn,.fc .dm,.fc .kl{position:absolute;inset:0;opacity:0}
.fc .tn{background:var(--ink)}.fc .dm{background:#000}.fc .kl{background:var(--red);mix-blend-mode:multiply}
.card .now{left:calc(var(--u)*14);top:calc(var(--u)*14);transform-origin:0 0;padding:calc(var(--u)*3) calc(var(--u)*10) calc(var(--u)*2);
  background:var(--fill);color:var(--ink);font:700 calc(var(--u)*15)/1.1 var(--fb);letter-spacing:.12em;clip-path:var(--cut);opacity:0;white-space:nowrap}

/* index: outlined P3 numerals with rolling digits; sits above the left neighbour */
#idx{display:none !important;position:absolute;left:0;top:0;z-index:1200;white-space:nowrap;transform-origin:100% 100%;pointer-events:none;opacity:0;will-change:transform,opacity;
  font-family:var(--fd);font-style:italic;font-weight:900;filter:drop-shadow(0 0 calc(var(--u)*1) rgba(4,16,60,.95)) drop-shadow(0 0 calc(var(--u)*3) rgba(4,16,60,.9)) drop-shadow(0 calc(var(--u)*4) calc(var(--u)*14) rgba(0,0,30,.45))}
#idx .n{display:inline-flex;font-size:calc(var(--u)*210);line-height:1;letter-spacing:-.02em;vertical-align:bottom}
#idx .dg{display:inline-block;height:1em;overflow-x:visible;overflow-y:clip;padding:0 .02em}
#idx .dg i{display:block;font-style:inherit;will-change:transform}
#idx .dg i b{display:block;height:1em;font-weight:900;color:transparent;-webkit-text-stroke:calc(var(--u)*3) var(--fill);font-variant-numeric:tabular-nums;text-align:center}
#idx .o{display:inline-block;font-size:calc(var(--u)*58);line-height:1;color:var(--fill);margin-left:calc(var(--u)*10);vertical-align:bottom;padding-bottom:calc(var(--u)*22)}

/* title + meta, under the hero, rotated with the axis. No plate behind it. */
#ttl{position:absolute;left:0;top:0;z-index:1200;transform-origin:0 0;pointer-events:none;opacity:0;will-change:transform,opacity}
#ttl .tw{position:relative;display:inline-block;will-change:transform,opacity;max-width:calc(var(--W)*.78);vertical-align:top}
#ttl .tx{display:block;font:italic 900 calc(var(--u)*46)/1.25 var(--fd);color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 .25em 0 0;
  text-shadow:0 1px 3px rgba(0,6,40,.75),0 2px 18px rgba(0,6,40,.6)}
#ttl .m{display:none;gap:calc(var(--u)*8);align-items:center;margin:calc(var(--u)*8) 0 0 calc(var(--u)*2);font:700 calc(var(--u)*17)/1 var(--fb);letter-spacing:.1em;color:var(--tx);
  text-shadow:0 1px 3px rgba(0,6,40,.85),0 2px 14px rgba(0,6,40,.6)}
#ttl .m i{font-style:normal;color:var(--tx);background:var(--panel);padding:calc(var(--u)*4) calc(var(--u)*9) calc(var(--u)*3);clip-path:var(--cut);text-shadow:none}
#ttl .m i.on{background:var(--fill);color:var(--ink);font-family:var(--fz);letter-spacing:.06em}

/* key hints: one small panel pill, P3 kbd */
#hints{position:absolute;right:calc(var(--u)*40);bottom:calc(var(--u)*28);z-index:1300;display:flex;gap:calc(var(--u)*18);align-items:center;padding:calc(var(--u)*8) calc(var(--u)*18);
  background:rgba(2,10,60,.78);box-shadow:inset 0 0 0 1px var(--line);clip-path:var(--cut);font:700 calc(var(--u)*15)/1 var(--fz);color:rgba(236,252,255,.82);white-space:nowrap;opacity:0;pointer-events:none;will-change:transform,opacity}
#hints span{display:flex;align-items:center;gap:calc(var(--u)*6)}
#hints kbd{font:700 calc(var(--u)*14)/1 var(--fb);letter-spacing:.08em;display:inline-block;min-width:calc(var(--u)*24);text-align:center;padding:calc(var(--u)*4) calc(var(--u)*7) calc(var(--u)*3);
  background:var(--well);color:var(--tx);clip-path:var(--cut)}
#hints kbd.l{background:var(--fill);color:var(--ink)}
#hints kbd.r{box-shadow:inset calc(var(--u)*3) 0 0 var(--red)}
#empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1200;background:var(--panel);clip-path:var(--cut);padding:calc(var(--u)*22) calc(var(--u)*40);display:none;white-space:nowrap;text-align:center}
#empty .l{display:block;font:700 calc(var(--u)*20)/1 var(--fb);letter-spacing:.16em;color:var(--dim)}
#empty .z{display:block;margin-top:calc(var(--u)*12);font-size:calc(var(--u)*24);color:var(--tx)}

/* apply: clone of the hero grows to the screen rect */
#apply{position:absolute;inset:0;z-index:1500;pointer-events:none;visibility:hidden}
#apply .im{position:absolute;background:var(--ink);transform-origin:50% 50%;will-change:transform,opacity;overflow:hidden}
#apply .ii{position:absolute;inset:0;overflow:hidden;background:var(--ink)}
#apply .ii img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

#toast{position:fixed;left:50%;top:0;z-index:30;pointer-events:none;opacity:0;filter:drop-shadow(0 calc(var(--u)*4) calc(var(--u)*12) rgba(0,6,40,.45))}
#toast .b{display:flex;align-items:center;gap:calc(var(--u)*8);transform:translateX(-50%);padding:calc(var(--u)*12) calc(var(--u)*28) calc(var(--u)*12) calc(var(--u)*24);white-space:nowrap;
  background:var(--fill);color:var(--ink);clip-path:var(--cut);font-size:calc(var(--u)*19)}
#toast .b em{font:700 1.12em/1 var(--fb);letter-spacing:.1em;font-style:normal}
#toast.bad .b{box-shadow:inset calc(var(--u)*8) 0 0 var(--red);padding-left:calc(var(--u)*34)}
#toast.show{animation:tshow .38s var(--e-out) forwards}
#toast.hide{animation:thide .3s ease forwards}
@keyframes tshow{from{opacity:0;transform:translateY(calc(var(--u)*-14))}to{opacity:1;transform:none}}
@keyframes thide{from{opacity:1}to{opacity:0;transform:translateY(calc(var(--u)*-8))}}
#reo{position:fixed;left:50%;bottom:3vh;transform:translateX(-50%);z-index:6;font:500 12px/1.4 monospace;color:rgba(255,255,255,.85);background:rgba(0,0,0,.5);padding:4px 10px;opacity:0;transition:opacity .2s;pointer-events:none}
body.reo #reo{opacity:1}
@media (prefers-reduced-motion:reduce){#toast.show,#toast.hide{animation-duration:.15s}}
</style></head><body>
<div id="desk"><img class="dk" alt=""><img class="dk" alt="" style="opacity:0">
  <div class="barw"><img id="bar" alt="" src="../../p5-reference/p3-shell/assets/bar-current.png"></div>
  <div class="tag">模拟桌面 · 不属于界面</div></div>
<div id="ov" class="closed">
  <div id="stage"></div>
  <div id="idx"><span class="n"><span class="dg"><i></i></span><span class="dg"><i></i></span></span><span class="o">/ 18</span></div>
  <div id="ttl"><span class="tw"><span class="tx"></span></span><div class="m"></div></div>
  <div id="empty"><span class="l">EMPTY</span><span class="z">没有壁纸了 · U 撤销</span></div>
  <div id="hints">
    <span><kbd>←</kbd><kbd>→</kbd><kbd>H</kbd><kbd>L</kbd>切换</span>
    <span><kbd class="l">ENTER</kbd>应用</span>
    <span><kbd class="r">D</kbd>删除</span>
    <span><kbd>U</kbd>撤销</span>
    <span><kbd>ESC</kbd>关闭</span>
  </div>
  <div id="apply"><div class="im"><div class="ii"><img alt=""></div></div></div>
</div>
<div id="toast"><div class="b"></div></div>
<div id="reo">原型 · 按任意键或点击重新打开</div>
<script src="data.js"></script>
<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const root=document.documentElement,body=document.body,ov=$('#ov'),stage=$('#stage');
const deskImgs=$$('#desk .dk'),idxEl=$('#idx'),idxO=$('#idx .o'),ttlEl=$('#ttl'),ttTx=$('#ttl .tx'),ttTw=$('#ttl .tw'),mtEl=$('#ttl .m');
const rollers=$$('#idx .dg i'),hintsEl=$('#hints'),emptyEl=$('#empty');
const toastEl=$('#toast'),toastB=$('#toast .b');
const apEl=$('#apply'),apIm=$('#apply .im'),apIi=$('#apply .ii'),apImg=$('#apply .ii img');
const MON='HDMI-A-1';
const mq=matchMedia('(prefers-reduced-motion: reduce)');
let RM=mq.matches;mq.addEventListener&&mq.addEventListener('change',e=>{RM=e.matches});
const D=ms=>RM?ms*.5:ms;                 // every timing goes through D(): halved under reduced motion

// per-level profile, index = |distance| (0 hero .. 4 sliver, 5 off). Geometry from tide, treatment from surface.
const SX=[1,.36,.2,.1,.03,.02],SY=[1,.72,.56,.44,.36,.32];
const DROP=[0,.03,.07,.11,.15,.17];      // x H: far cards sink below the axis
const TINT=[0,.30,.50,.66,.78,.82];      // --ink wash
const DIM=[0,.16,.28,.38,.42,.42];       // black
const BLUR=[0,.4,.8,1,1,1];
const GLOW=[1,.6,.35,.15,0,0];           // contact shadow
const DS=[1,.55,.3,.12,0,0];             // card drop shadow (EDGE TREATMENT .ds)
const SH=[1,.5,.3,.15,0,0];              // soft floor shadow
const TILT=-6.5*Math.PI/180,TAN=Math.tan(TILT); // axis rises to the right
const lerpT=(T,a)=>{const i=Math.min(T.length-2,Math.floor(a)),f=Math.min(1,a-i);return T[i]+(T[i+1]-T[i])*f};
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const mod=(a,n)=>((a%n)+n)%n;
const wrapD=(x,n)=>{if(!n)return 0;let r=mod(x,n);if(r>n/2)r-=n;return r};
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eoe=t=>t>=1?1:1-Math.pow(2,-10*t);
const eoc=t=>1-Math.pow(1-t,3);
const ein=t=>t*t*t;
const eob=t=>{const c=1.15;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)}; // ~6% overshoot: buoyant, not bouncy
const now=()=>performance.now();

function Tw(v){return {v,from:v,to:v,t0:0,dur:1,ease:eio,act:false}}
function tw(o,to,delay,dur,ease){delay*=o.act&&o.to!==to?0:clamp(Math.abs(to-o.v));o.from=o.v;o.to=to;o.t0=now()+delay;o.dur=Math.max(1,dur);o.ease=ease;o.act=true}
function stepTw(o,t){if(!o.act)return false;const k=clamp((t-o.t0)/o.dur);
  if(t<o.t0){o.v=o.from;return true}o.v=o.from+(o.to-o.from)*o.ease(k);if(k>=1){o.v=o.to;o.act=false}return o.act}

let G={};
function geom(){
  const vw=innerWidth,vh=innerHeight,u=Math.min(vw/1920,vh/1080);
  const W=Math.min(vw*.4,vh*.8),H=W/1.6,g=vw*.0055;
  const cx=vw/2,by=vh*.625;              // no header bar: row sits a little higher than tide's .655
  const XS=[0];for(let k=1;k<SX.length;k++)XS[k]=XS[k-1]+(SX[k-1]+SX[k])*W/2+g;XS[5]=XS[4]+vw*.05;
  G={vw,vh,u,W,H,cx,by,XS};
  root.style.setProperty('--u',u+'px');root.style.setProperty('--W',W+'px');root.style.setProperty('--H',H+'px');
  root.style.setProperty('--barH',(vw*42/1706)+'px');
  toastEl.style.top=(vw*42/1706+u*34)+'px';
  // index: above the left neighbour, right edge on the hero's left edge
  G.nTop=by-XS[1]*TAN+DROP[1]*H-SY[1]*H;
  G.ix=cx-W/2-14*G.u;G.iy=G.nTop-8*G.u;
  G.tx=cx-W/2+4*u;G.ty=by+10*u+W*.78*Math.sin(-TILT);  // title capped at .78W; its rising right end clears the hero
  Object.assign(apIm.style,{width:W+'px',height:H+'px',left:(cx-W/2)+'px',top:(by-H)+'px'});
}

// ---------- items ----------
let uid=0;
function mkItem(w){
  const el=document.createElement('div');el.className='card';
  el.innerHTML='<div class="gl"></div><div class="sh"></div><div class="ds"><i></i></div>'+
    '<div class="fc"><img class="a" alt="" decoding="async"><img class="b" alt="" decoding="async"><div class="tn"></div><div class="dm"></div><div class="kl"></div></div>'+
    '<div class="ln"></div><div class="now">NOW</div>';
  const Q=s=>el.querySelector(s);
  const it={id:++uid,w,el,r:null,dvR:9,pulse:-1,shift:0,sv:0,hold:0,hv:0,hov:false,app:1,appT0:0,shown:false,src:false,o:Tw(0),om:'open',
    q:{gl:Q('.gl'),sh:Q('.sh'),ds:Q('.ds'),a:Q('.fc .a'),b:Q('.fc .b'),tn:Q('.tn'),dm:Q('.dm'),kl:Q('.kl'),now:Q('.now')}};
  el.addEventListener('pointerenter',()=>{it.hov=true;kick()});
  el.addEventListener('pointerleave',()=>{it.hov=false;kick()});
  el.addEventListener('click',e=>{e.stopPropagation();onCard(it)});
  stage.appendChild(el);
  return it;
}
function ensureSrc(it){if(it.src)return;it.src=true;const u='walls/'+it.w.f;it.q.a.src=u;it.q.b.src=u}
let items=WALLS.map(mkItem);
let applied=items[0]?items[0].w.f:null;
deskImgs[0].src='walls/'+applied;

// ---------- state ----------
let pos=0,vel=0,target=0;             // shared position spring
const acc={r:0,v:0,id:null};          // selection settle: 0 = resting, 1 = selected card lifted (scale + shadow); springs a beat after landing
const rol=[{r:0,v:0,t:0},{r:1,v:0,t:1}]; // digit rollers (tens, ones)
let open=false,ap=null,reoT=0;
const chrome={acc:Tw(0),lab:Tw(0),hint:Tw(0)};
const ghosts=[],undo=[];
let raf=0,last=0;
const K=280,C=27,K2=300,C2=30,MAXLEAD=3,KA=260,CA=17,KR=300,CR=30; // KA/CA zeta~.53: the selected card lifts with a visible ~14% overshoot
const RIP=.022,CRM=2*Math.sqrt(K); // reduced motion: critically damped, no overshoot
let shownCid=null,pendCid=null,accTgt=1;

function kick(){if(!raf){last=now();raf=requestAnimationFrame(tick)}}
function n(){return items.length}
function centreIdx(){return n()?mod(Math.round(pos),n()):-1}
function capLead(){const d=target-pos;if(Math.abs(d)>MAXLEAD)target=Math.round(pos+Math.sign(d)*MAXLEAD)}
const hist=[];let lastMoveT=0;
function posAt(tq){
  if(!hist.length||tq>=hist[hist.length-1][0])return pos;
  if(tq<=hist[0][0])return hist[0][1];
  for(let i=hist.length-1;i>0;i--){const a=hist[i-1],b=hist[i];
    if(tq>=a[0]){const f=(tq-a[0])/Math.max(1e-6,b[0]-a[0]);return a[1]+(b[1]-a[1])*f}}
  return hist[0][1];
}
function shiftAll(off){pos-=off;target-=off;for(const h of hist)h[1]-=off}
const spr=(o,k,c,to,h)=>{o.v+=(k*(to-o.r)-c*o.v)*h;o.r+=o.v*h};

function tick(t){
  raf=0;
  const dt=Math.min(.05,(t-last)/1000);last=t;
  let busy=false;
  const steps=Math.max(1,Math.ceil(dt*240)),h=dt/steps;
  const p0=pos;
  for(let s=0;s<steps;s++){
    vel+=(K*(target-pos)-(RM?CRM:C)*vel)*h;pos+=vel*h;
    spr(acc,KA,CA,accTgt,h);
    for(const r of rol)spr(r,KR,CR,r.t,h);
    for(const it of items){if((it.shift||it.sv)&&t>=it.hold){it.sv+=(-K2*it.shift-C2*it.sv)*h;it.shift+=it.sv*h}}
  }
  if(Math.abs(target-pos)<4e-4&&Math.abs(vel)<2e-3){pos=target;vel=0}else busy=true;
  if(Math.abs(accTgt-acc.r)<1e-3&&Math.abs(acc.v)<3e-3){acc.r=accTgt;acc.v=0}else busy=true;
  for(const r of rol){if(Math.abs(r.t-r.r)<1e-3&&Math.abs(r.v)<3e-3){r.r=r.t;r.v=0}else busy=true}
  if(pos!==p0)lastMoveT=t;
  hist.push([t,pos]);while(hist.length>2&&hist[1][0]<t-260)hist.shift();
  if(!RM&&t-lastMoveT<RIP*5000+20)busy=true;
  for(const it of items){
    if(it.shift||it.sv){if(Math.abs(it.shift)<4e-4&&Math.abs(it.sv)<2e-3&&t>=it.hold){it.shift=0;it.sv=0}else busy=true}
    const ht=it.hov&&open&&!ap?1:0;it.hv+=(ht-it.hv)*(1-Math.exp(-dt*(RM?30:14)));
    if(Math.abs(ht-it.hv)<.003)it.hv=ht;else busy=true;
    if(it.app<1){it.app=clamp((t-it.appT0)/D(560));busy=true}
    if(stepTw(it.o,t))busy=true;
    if(it.pulse>=0){if(t-it.pulse>D(320))it.pulse=-1;else busy=true}
  }
  for(const k in chrome)if(stepTw(chrome[k],t))busy=true;
  for(let i=ghosts.length-1;i>=0;i--){const g=ghosts[i];g.k=clamp((t-g.t0)/(RM?150:560));if(g.k>=1){g.it.el.remove();ghosts.splice(i,1)}else busy=true}
  if(ap){stepApply(t);busy=true}
  if(stepLabel(t))busy=true;
  if(!open&&!busy&&!ov.classList.contains('closed'))ov.classList.add('closed');
  render(t);
  if(busy)raf=requestAnimationFrame(tick);
}

// velocity response (off under reduced motion): a small lean along the travel and a slight stretch
const lean=()=>RM?0:clamp(-vel*.34,-5,5);
const stretch=()=>RM?1:1+Math.min(.06,Math.abs(vel)*.004);

function cardTf(it,dv,gk){
  const a=Math.abs(dv),s=dv<0?-1:1,o=it.o.v,H=G.H;
  const sx=lerpT(SX,a),sy=lerpT(SY,a);
  let fan=1,sc=1,y=0,op=a>4?clamp(1-(a-4)):1,rot=0;
  if(RM){op*=o}
  else if(it.om==='close'){fan=.55+.45*o;sc*=.9+.1*o;y+=(1-o)*H*.32;op*=clamp((o-.08)/.5)}  // sink and gather
  else if(a<.5){sc*=.86+.14*o;y+=(1-o)*H*.42;op*=clamp(o*2.6)}                          // hero rises last, buoyant
  else{fan=.5+.5*o;y+=(1-o)*H*.5;op*=clamp(o*2.2)}                                      // sides surface from the middle out
  const x=s*lerpT(G.XS,a)*fan;
  y+=x*TAN+lerpT(DROP,a)*H;                 // ride the tilted axis, far cards sink deeper
  y-=it.hv*H*(a>.5?.05*clamp(a*2):.014);    // hover: float up
  let sk=0,st=1;
  if(gk==null){sk=lean();st=stretch()}
  if(it.app<1){const e=eob(it.app);if(!RM){y+=(1-e)*H*.22;sc*=.88+.12*e}op*=clamp(it.app*4)}
  it.selK=0;
  if(gk==null&&it===S){const k=acc.r*chrome.acc.v*clamp(1-a*2);it.selK=k;sc*=1+.022*k;y-=k*H*.018}  // selection settle: lift + grow
  if(it.pulse>=0){const k=clamp((now()-it.pulse)/D(320));sc*=1+.035*Math.sin(Math.PI*k);y-=Math.sin(Math.PI*k)*H*.02}
  if(gk!=null&&RM)op*=1-gk;
  else if(gk!=null){ // falls with weight: tiny lift, then gravity
    const lift=gk<.16?Math.sin(gk/.16*Math.PI)*G.vh*.012:0;
    y+=gk*gk*G.vh*.46-lift;rot=gk*gk*(s>=0?6:-6)+gk*gk*4;sc*=1-.1*gk;op*=1-clamp((gk-.28)/.6)}
  if(it.apHide)op=0;
  const X=G.cx+x,Y=G.by+y,SXv=sx*sc*st,SYv=sy*sc/Math.sqrt(st);
  return {tf:`translate3d(${X.toFixed(2)}px,${Y.toFixed(2)}px,0) rotate(${rot.toFixed(2)}deg) skewX(${sk.toFixed(2)}deg) scale(${SXv.toFixed(4)},${SYv.toFixed(4)})`,
    op,a,sx:SXv,sy:SYv,X,Y};
}
let S=null;  // selected (nearest) card
function paint(it,dv,z,gk){
  const el=it.el;
  if(Math.abs(dv)>5.2&&gk==null){it.dvR=9;if(it.shown){el.style.visibility='hidden';it.shown=false}return}
  ensureSrc(it);
  if(!it.shown){el.style.visibility='visible';it.shown=true}
  const r=cardTf(it,dv,gk),a=r.a,hv=it.hv,q=it.q;
  if(gk==null){it.r=r;it.dvR=dv}
  el.style.transform=r.tf;el.style.opacity=r.op.toFixed(3);el.style.zIndex=z;
  el.style.setProperty('--isx',(1/Math.max(1e-3,r.sx)).toFixed(4));el.style.setProperty('--isy',(1/Math.max(1e-3,r.sy)).toFixed(4));  // EDGE TREATMENT screen-px units
  el.style.setProperty('--sel',it.selK.toFixed(4));
  // photo stays un-stretched (counter-scale, cover) with 8% overscan for parallax against the motion
  const m=Math.max(r.sx,r.sy),ix=(m/r.sx*1.08).toFixed(4),iy=(m/r.sy*1.08).toFixed(4);
  const px=gk==null&&!RM?clamp(vel*.55,-3.5,3.5):0;
  const ist=`translateX(${px.toFixed(2)}%) scale(${ix},${iy})`;
  q.a.style.transform=ist;q.b.style.transform=ist;
  q.b.style.opacity=(lerpT(BLUR,a)*(1-hv*.7)).toFixed(3);
  q.tn.style.opacity=Math.max(0,lerpT(TINT,a)-hv*.3).toFixed(3);
  q.dm.style.opacity=(lerpT(DIM,a)*(1-hv*.6)).toFixed(3);
  q.gl.style.opacity=lerpT(GLOW,a).toFixed(3);
  q.sh.style.opacity=(lerpT(SH,a)*(1+hv*.3)).toFixed(3);
  q.sh.style.transform=`translateY(${(hv*G.H*.04/r.sy).toFixed(2)}px)`;
  q.ds.style.opacity=gk!=null?0:(lerpT(DS,a)*(.8+.2*it.selK+hv*.15)).toFixed(3);
  q.kl.style.opacity=gk!=null?(gk<.2?gk/.2*.8:.8).toFixed(3):0;
  const isNow=it.w.f===applied&&gk==null;
  q.now.style.opacity=isNow?clamp(1-a*1.6).toFixed(3):0;
  if(isNow)q.now.style.transform=`scale(${(1/r.sx).toFixed(3)},${(1/r.sy).toFixed(3)})`;
}
function render(t){
  const N=n();t=t||now();
  S=null;for(const it of items)if(it.shown&&it.r&&(!S||Math.abs(it.dvR)<Math.abs(S.dvR)))S=it;
  if(S&&S.id!==acc.id){acc.id=S.id;acc.r=0;acc.v=0}
  if(S){const spd=Math.abs(vel)+Math.abs(S.sv);accTgt=RM?1:clamp(1-(spd-.4)/2.2)}
  for(let i=0;i<N;i++){
    const it=items[i],a0=Math.abs(wrapD(i-pos,N));
    if(!it.src&&Math.abs(wrapD(i-target,N))<=6)ensureSrc(it);
    const a5=Math.min(a0,5);   // ripple: far cards sample pos from slightly earlier; lag capped so flicks stay coherent
    const p=RM?pos:posAt(t-Math.min(RIP*a5*1000,250*a5/Math.max(Math.abs(vel),1)));
    const dv=wrapD(i-p,N)+it.shift;
    paint(it,dv,1000-Math.round(Math.abs(dv)*100),null);
  }
  for(const g of ghosts)paint(g.it,g.dv,RM?1001:1000-Math.round(100*clamp((g.k-.22)/.1))-1,g.k); // drops behind the closing neighbours once they arrive
  emptyEl.style.display=N?'none':'block';
  // label: index above the left neighbour, title under the hero; both rotate with the axis
  const lv=chrome.lab.v,av=Math.abs(vel);
  const lean2=RM?0:clamp(-vel*G.u*6,-G.u*30,G.u*30);
  const ty=(1-lv)*G.H*.28,lo=clamp(lv*1.4)*(N?1:0)*(1-.45*clamp((av-6)/4));
  idxEl.style.transform=`translate3d(${(G.ix+lean2*.6).toFixed(2)}px,${(G.iy+ty).toFixed(2)}px,0) translate(-100%,-100%) rotate(${TILT}rad)`;
  ttlEl.style.transform=`translate3d(${(G.tx+lean2).toFixed(2)}px,${(G.ty+ty*.8).toFixed(2)}px,0) rotate(${TILT}rad)`;
  idxEl.style.opacity=lo.toFixed(3);ttlEl.style.opacity=lo.toFixed(3);
  for(const r of rol)r.el.style.transform=`translateY(${(-mod(r.r,10)).toFixed(4)}em)`;
  const hv=chrome.hint.v;
  hintsEl.style.opacity=hv.toFixed(3);hintsEl.style.transform=`translateY(${((1-hv)*G.u*16).toFixed(2)}px)`;
}

const pad=v=>String(v).padStart(2,'0');
const esc=s=>String(s).replace(/[<&>]/g,c=>({'<':'&lt;','&':'&amp;','>':'&gt;'})[c]);
// title: hidden while the centre is changing, shown again once the row settles on a card (no wipe bar)
const tTw=Tw(0);let tWant=0;
function setRollers(ci,N){
  const v=N?ci+1:0,tens=Math.floor(v/10),ones=v%10;
  rol[0].t+=wrapD(tens-rol[0].t,10);rol[1].t+=wrapD(ones-rol[1].t,10);
  idxO.textContent='/ '+pad(N);
}
function fillTitle(ci){
  if(ci<0){ttTx.textContent='—';mtEl.innerHTML='';return}
  const w=items[ci].w,tt=String(w.title||'').trim();ttTx.textContent=[...tt].length<2?'PIXIV '+w.pid:tt; // lone glyph/emoji titles read as empty
  mtEl.innerHTML='PIXIV <i>'+esc(w.pid)+'</i><i>'+esc(String(w.page).toUpperCase())+'</i><i>'+esc(w.ext)+'</i>';  // NOW tag on the card already marks the applied one
}
let lastN=-1;
function stepLabel(t){
  const N=n(),ci=N?mod(Math.round(pos),N):-1,cid=ci<0?null:items[ci].id;
  if(cid!==pendCid||N!==lastN){pendCid=cid;lastN=N;setRollers(ci,N)}
  if(shownCid===null&&N){fillTitle(ci);shownCid=cid;tTw.v=tTw.to=1;tTw.act=false;tWant=1}  // first open: chrome.lab fades it in
  const tci=N?mod(Math.round(target),N):-1;
  const settled=!N||(tci===ci&&Math.abs(target-pos)<.06&&Math.abs(vel)<.6&&Math.abs(items[ci].shift)<.06&&Math.abs(items[ci].sv)<.6);
  const want=settled&&cid===shownCid?1:0;
  if(want!==tWant){tWant=want;if(want)tw(tTw,1,0,D(200),eoc);else tw(tTw,0,0,D(90),eoc)}
  let busy=stepTw(tTw,t);
  if(settled&&cid!==shownCid&&tTw.v===0&&!tTw.act){fillTitle(ci);shownCid=cid;tWant=1;tw(tTw,1,0,D(200),eoc);busy=true}
  if(!settled||cid!==shownCid)busy=true;   // keep ticking until the title is back
  const v=tTw.v,inn=tWant===1;            // entering: slide in from the left; leaving: plain quick fade
  ttTw.style.opacity=v.toFixed(3);
  ttTw.style.transform=inn&&!RM?`translateX(${((1-v)*-12*G.u).toFixed(2)}px)`:'';
  return busy;
}

// ---------- open / close ----------
function setOpen(v){
  if(v===open)return;open=v;const N=n();
  body.classList.remove('reo');
  if(v){
    ov.classList.remove('closed');
    for(let i=0;i<N;i++){const it=items[i],a=Math.abs(wrapD(i-target,N));it.om='open';
      if(RM)tw(it.o,1,0,150,eio);
      else if(a<.5)tw(it.o,1,90,560,eob);              // hero surfaces last, gentle overshoot
      else if(a<=5.2)tw(it.o,1,(a-1)*D(42),D(480),eob); // sides drift up and out from the middle, staggered
      else{it.o.v=1;it.o.act=false}}
    tw(chrome.acc,1,D(420),D(360),eoc);
    tw(chrome.lab,1,D(430),D(480),eob);
    tw(chrome.hint,1,D(560),D(320),eoc);
  }else{
    for(const k in chrome)tw(chrome[k],0,0,D(130),ein);   // chrome leaves first
    for(let i=0;i<N;i++){const it=items[i],a=Math.abs(wrapD(i-pos,N));it.om='close';
      if(RM)tw(it.o,0,0,150,eio);
      else if(a<.5)tw(it.o,0,D(200),D(240),ein);                          // hero sinks last
      else if(a<=5.2)tw(it.o,0,(5-Math.min(a,5))*D(28),D(240),ein); // outer cards sink first, gathering inward
      else{it.o.v=0;it.o.act=false}}
  }
  kick();
}

// ---------- apply: grow to screen, swap desktop, dissolve ----------
function applyCur(){
  if(!open||ap)return;
  if(!n()){toast('没有可应用的壁纸',1);return}
  target=Math.round(target);capLead();
  const ci=mod(Math.round(target),n()),it=items[ci];
  if(it.w.f===applied){it.pulse=now();toast('已是当前壁纸');kick();return} // nothing would change: just a pulse
  apImg.src='walls/'+it.w.f;
  ap={it,t0:now(),swapped:false,closed:false,A:D(60),E:D(480),F:D(420),dk:0,sk:it.selK||0};  // sk: hero's selection lift, so the clone starts exactly on it
  it.apHide=false;apEl.style.visibility='visible';apIm.style.opacity=1;
  for(const k in chrome)tw(chrome[k],0,0,D(120),ein);
  // other cards bow out while the clone grows
  const N=n();for(let i=0;i<N;i++){const o=items[i];if(o===it)continue;const a=Math.abs(wrapD(i-pos,N));o.om='close';
    tw(o.o,0,Math.min(a,5)*D(22),D(260),ein)}
  kick();
}
function stepApply(t){
  const k=t-ap.t0,A=ap.A,E=ap.E,F=ap.F,vw=G.vw,vh=G.vh;
  const sx=vw/G.W*1.03,sy=vh/G.H*1.03;
  if(k>0)ap.it.apHide=true;
  // short anticipation (dip to .97), then an ease-in-out surge to full screen: no snap-then-stall
  const pre=.03*Math.sin(clamp(k/A)*Math.PI/2),p=k<A?0:eio(clamp((k-A)/(E-A)));
  const b0=(1+.022*ap.sk)*(1-pre);   // start scale = hero's selected scale
  const s1=b0+(sx-b0)*p,s2=b0+(sy-b0)*p;
  // centre drifts from the hero to the screen centre so the clone really covers the screen (hero sits above centre)
  const c0x=G.cx,c0y=G.by-G.H/2-G.H*.011*ap.sk-G.H*.018*ap.sk,dx=(vw/2-c0x)*p,dy=(vh/2-c0y)*p,hx=s1*G.W/2,hy=s2*G.H/2;
  const covers=c0x+dx-hx<=0&&c0x+dx+hx>=vw&&c0y+dy-hy<=0&&c0y+dy+hy>=vh;
  apIm.style.transform=`translate(${dx.toFixed(2)}px,${dy.toFixed(2)}px) scale(${s1.toFixed(4)},${s2.toFixed(4)})`;
  const m=Math.max(s1,s2);apImg.style.transform=`scale(${(m/s1).toFixed(4)},${(m/s2).toFixed(4)})`;
  // EDGE TREATMENT on the clone: same shape/shadow as the hero, fading out (--ek 1->0) as it reaches the screen
  apIm.style.setProperty('--ek',(1-p).toFixed(4));apIm.style.setProperty('--isx',(1/s1).toFixed(5));apIm.style.setProperty('--isy',(1/s2).toFixed(5));
  if(!ap.swapped&&(covers||k>=E)){ap.swapped=true;applied=ap.it.w.f;ap.dk=Math.max(k,E-D(80)); // dissolve starts ~80ms before the grow ends
    // desktop swaps underneath the full-screen clone, so nothing visible changes yet
    deskImgs[0].src='walls/'+applied;
    {const c=mod(Math.round(pos),n());fillTitle(c);shownCid=items[c].id}   // label is hidden now; refresh it for the reopen
    }
  if(ap.swapped){apIm.style.opacity=(1-eio(clamp((k-ap.dk)/F))).toFixed(3)}
  if(!ap.closed&&ap.swapped){ap.closed=true;open=false;
    for(const it of items){it.om='close';it.o.v=0;it.o.act=false}}
  if(ap.swapped&&k>=ap.dk+F){apEl.style.visibility='hidden';apIm.style.transform='';apIm.style.opacity=1;ap.it.apHide=false;ap=null;
    ov.classList.add('closed');body.classList.add('reo');
    // real app: overlay stays closed here. Prototype: reopen after ~1s.
    clearTimeout(reoT);reoT=setTimeout(()=>{if(!open&&!ap)setOpen(true)},1000)}
}

// ---------- delete / restore ----------
function reindex(mut){
  const N0=n(),before=new Map();
  items.forEach((it,i)=>before.set(it,wrapD(i-pos,N0)+it.shift));
  mut();
  const N=n();
  items.forEach((it,i)=>{if(!before.has(it))return;let s=before.get(it)-wrapD(i-pos,N);
    if(Math.abs(s)>3){s=0;it.sv=0}it.shift=s});
}
function stagger(base,per){const t=now(),N=n();items.forEach((it,i)=>{if(it.shift){const a=Math.abs(wrapD(i-pos,N));it.hold=t+base+Math.min(a,5)*per}})}
function del(){
  if(!n()||!open||ap)return;
  const N0=n(),ci=mod(Math.round(target),N0);
  shiftAll(target-ci);
  const it=items[ci],dv=wrapD(ci-pos,N0)+it.shift;
  reindex(()=>{items.splice(ci,1)});
  ghosts.push({it,dv,t0:now(),k:0});it.hov=false;
  undo.push({it,idx:ci});
  if(!n()){target=0;pos=0}
  stagger(D(90),D(45));   // neighbours wait for the fall, then close in from nearest outward
  toast(n()?'已移入回收站 · <em>U</em> 撤销':'已移入回收站',1);kick();
}
function restore(){
  if(!undo.length||!open||ap)return;
  const {it:old,idx}=undo.pop();
  const it=mkItem(old.w);it.app=0;it.appT0=now()+D(140);it.o.v=1;it.om='open';
  const N0=n();
  if(N0)shiftAll(target-mod(Math.round(target),N0));
  const ins=Math.min(idx,N0);
  reindex(()=>{items.splice(ins,0,it)});
  const d=wrapD(ins-mod(target,n()),n());target+=d;
  if(N0===0){pos=target=ins}
  stagger(0,D(30));       // neighbours part first, card pops into the gap
  toast('已恢复 · '+esc(old.w.title));kick();
}

// ---------- actions / input ----------
function go(d){if(!n()||!open||ap)return;target+=d;capLead();kick()}
function goIdx(i){if(!n()||!open||ap)return;target+=wrapD(i-mod(target,n()),n());kick()}
function onCard(it){
  if(!open){if(!ap)setOpen(true);return}
  const i=items.indexOf(it);if(i<0)return;
  if(Math.abs(wrapD(i-pos,n()))<.5)applyCur();else goIdx(i);
}
let toastT=0;
function toast(html,bad){
  toastB.innerHTML=html;toastEl.classList.toggle('bad',!!bad);
  toastEl.classList.remove('hide','show');void toastEl.offsetWidth;toastEl.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>{toastEl.classList.remove('show');toastEl.classList.add('hide')},2300);
}
addEventListener('keydown',e=>{
  if(ap){e.preventDefault();return}
  if(!open){e.preventDefault();clearTimeout(reoT);setOpen(true);return}
  const k=e.key;
  if(k==='ArrowRight'||k==='l'||k==='L')go(1);
  else if(k==='ArrowLeft'||k==='h'||k==='H')go(-1);
  else if(k==='Home')goIdx(0);
  else if(k==='End')goIdx(n()-1);
  else if(k==='Enter'||k===' '){if(!e.repeat)applyCur()}
  else if(k==='d'||k==='D'||k==='Delete'){if(!e.repeat)del()}
  else if(k==='u'||k==='U'){if(!e.repeat)restore()}
  else if(k==='Escape')setOpen(false);
  else return;
  e.preventDefault();
});
let wAcc=0,wT=0;
addEventListener('wheel',e=>{
  e.preventDefault();if(!open||ap)return;
  let d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;if(e.deltaMode===1)d*=40;
  const t=now();if(t-wT>220||Math.sign(d)!==Math.sign(wAcc))wAcc=0;wT=t;
  wAcc+=d;if(Math.abs(wAcc)>=100){go(Math.sign(wAcc));wAcc=0}
},{passive:false});
addEventListener('click',()=>{if(!open&&!ap){clearTimeout(reoT);setOpen(true)}});
addEventListener('resize',()=>{geom();render();kick()});

// ---------- init ----------
for(let j=0;j<2;j++){rollers[j].innerHTML='0123456789'.split('').map(c=>'<b>'+c+'</b>').join('')+'<b>0</b>';rol[j].el=rollers[j]}
geom();setRollers(0,n());rol[0].r=rol[0].t;rol[1].r=rol[1].t;
render();setOpen(true);
// warm the decode cache for the rest of the list once the open animation is done
setTimeout(()=>{for(const it of items){ensureSrc(it);it.q.a.decode&&it.q.a.decode().catch(()=>{})}},D(900));
window.__p5={get pos(){return pos},get target(){return target},get n(){return n()},get open(){return open},get running(){return !!raf},
  get centre(){const c=centreIdx();return c<0?null:items[c].w.f},get applied(){return applied},get vel(){return vel},get shown(){return items.filter(i=>i.shown).length},get files(){return items.map(i=>i.w.f)},
  go,goIdx,del,restore,applyCur,setOpen};
})();
</script></body></html>
