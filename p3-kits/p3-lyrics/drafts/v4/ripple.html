<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P3 Lyrics Ripple</title>
<style>
@font-face { font-family: "P3"; src: url("../../../../p5-reference/p3-menu/fonts/pe0RMImSLYBIv1o4X1M8cce4OdVisMz5nZRqy6cmmmU3t3NeCAAFOvV9FtjrwlNwjM6W3Y6K5co2d-laLQ.woff2") format("woff2"); font-weight: 900; font-style: italic; }
@font-face { font-family: "BarlowC"; src: url("../../../../p5-reference/save-carousel/fonts/BarlowCondensed-Bold.ttf") format("truetype"); font-weight: 700; }

/* 颜色只取 p3.css 的两套 token；浅背景时主句用 --ink，翻译用 --sea（tokens.css 的深海蓝） */
:root, [data-theme="p3"] {
  --ink: #04103c; --tx: #ecfcff; --fill: #a3f0ff; --sea: #0626c4;
}
[data-theme="lavender"] {
  --ink: #1b0f33; --tx: #f6f0ff; --fill: #d0bcff; --sea: #4b2f9e;
}
:root { --main: var(--tx); --sub: var(--fill); --page: #000510; }
[data-bg="light"] { --main: var(--ink); --sub: var(--sea); --page: #e8edf1; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #000510; } }
:root[data-bg="light"] { --page: #e8edf1; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--page); }
body { user-select: none; -webkit-user-select: none; cursor: default; }

#stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
  margin: -540px 0 0 -960px; overflow: hidden; transform-origin: 50% 50%; }
#bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
[data-theme="lavender"] #bg { filter: hue-rotate(38deg) saturate(.55) brightness(.92); }
[data-bg="light"] #bg { display: none; }
#stage { background: var(--page); }

/* 歌词层：主句底边固定在 y=844，右缘固定在 x=1800（bg.png 右下的深海区） */
#lyr { position: absolute; right: 120px; bottom: 236px; width: 0; height: 0;
  transition: opacity .32s cubic-bezier(.22,.9,.24,1); }
#lyr.paused { opacity: .42; }
.blk { position: absolute; right: 0; bottom: 0; text-align: right; white-space: nowrap; }

/* 每一行有自己的「水面」：.msk 的下沿。.in 从水面下浮上来，沉回去 */
.msk { display: block; position: relative; overflow: hidden; padding: .1em .3em .22em; margin: -.1em -.3em -.22em; }
.in { display: inline-block; will-change: transform; }

.m { color: var(--main); }
.m .msk + .msk { margin-top: calc(-.22em + 2px); }
/* 中文 / 日文主句：P3 shell 的 .zh 调性，加重到 Bold、放大，字距收紧一点 */
.cjk .m { font-family: "Noto Sans CJK SC", "Source Han Sans CN", sans-serif; font-weight: 700;
  font-size: 58px; line-height: 1.22; letter-spacing: .06em; }
.cjk[lang="ja"] .m { font-family: "Noto Sans CJK JP", "Noto Sans CJK SC", sans-serif; }
/* 英文主句：P3R 展示字 */
.lat .m { font-family: "P3", "Noto Sans CJK SC", sans-serif; font-style: italic; font-weight: 900;
  font-size: 66px; line-height: 1.02; letter-spacing: -.005em; }

/* 翻译：.zh 原样（Medium 500，.08em），用 --fill；挂在主句下方，不参与主句布局 */
.tr { position: absolute; top: 100%; right: 0; margin-top: 14px; color: var(--sub);
  font-family: "Noto Sans CJK SC", sans-serif; font-style: normal; font-weight: 500; font-size: 26px;
  line-height: 1.3; letter-spacing: .08em; }
.lat .tr { margin-top: 18px; }

/* 波纹：每个字一个 .g，只做几像素的 translateY；字色、字形不变 */
.g { display: inline-block; }
/* 水线：整块歌词底部一条与块同宽的 1.2px 平涂细线，常驻、很淡；
   波纹经过时只在波峰处局部隆起。两端用遮罩淡出（遮罩在线的容器上，不在字上） */
.wvc { position: absolute; right: 0; top: 100%; height: 10px; pointer-events: none;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent); }
/* 底线常驻偏暗；.hi 是同形的亮线，只露出波峰附近一段（遮罩随波峰移动），波峰最亮、两侧渐暗 */
.wv { display: block; overflow: hidden; position: absolute; left: 0; top: 0; opacity: .3; }
.wv.hi { opacity: 1; -webkit-mask: linear-gradient(90deg, transparent, #000 50%, transparent) 0 0 / var(--spot, 350px) 100% no-repeat;
  mask: linear-gradient(90deg, transparent, #000 50%, transparent) 0 0 / var(--spot, 350px) 100% no-repeat;
  -webkit-mask-position: -9999px 0; mask-position: -9999px 0; }
[data-bg="light"] .wv { opacity: .45; }
[data-bg="light"] .wv.hi { opacity: .9; }
.wv path { fill: none; stroke: var(--sub); stroke-width: 1.2; stroke-linecap: round; }
/* 歌名下的歌手：BarlowC 标签字，中文歌手名回落到 Noto 500 */
.tr.by { font-family: "BarlowC", "Noto Sans CJK SC", sans-serif; font-weight: 700; font-size: 24px;
  letter-spacing: .2em; text-transform: uppercase; margin-top: 16px; }
</style>
</head>
<body>
<div id="stage">
  <img id="bg" src="../../../../p5-reference/p3-miku/bg.png" alt="">
  <div id="lyr"></div>
</div>
<script>
const Q = new URLSearchParams(location.search);
const root = document.documentElement;
if (Q.get('bg') === 'light') root.dataset.bg = 'light';
root.dataset.theme = Q.get('theme') === 'lavender' ? 'lavender' : 'p3';
const SLOW = Math.max(.05, +Q.get('slow') || 1);
const RM = matchMedia('(prefers-reduced-motion: reduce)');

/* 原创假歌，行级时间戳（照搬 v2/slab.html） */
const SONGS=[
 {title:'铁皮屋顶的夏天',artist:'灯塔与猫',lang:'zh-CN',end:38,lines:[
  {t:2.0,text:'蝉声把午后拉得很长',trans:''},
  {t:5.6,text:'我数着铁轨上的光',trans:''},
  {t:9.0,text:'跑',trans:''},
  {t:10.0,text:'再快一点',trans:''},
  {t:12.0,text:'直到风也追不上我们那年|骑着单车穿过整条没有尽头的河堤',trans:''},
  {t:18.0,text:'夏天不说再见',trans:''},
  {t:30.0,text:'屋顶又落雨',trans:''},
  {t:33.4,text:'我还在等你',trans:''}]},
 {title:'硝子の月',artist:'宵町ユラ',lang:'ja',end:35,lines:[
  {t:2.0,text:'硝子の月が割れる夜に',trans:'在玻璃月亮碎裂的夜里'},
  {t:5.4,text:'名前を呼んで',trans:'呼唤我的名字'},
  {t:8.2,text:'ねえ',trans:'呐'},
  {t:9.2,text:'聞こえる？',trans:'听得见吗'},
  {t:11.0,text:'遠く離れても消えない光を|胸の奥にずっと抱いて走るから',trans:'就算相隔遥远 我也会把不灭的光抱在心底一直奔跑'},
  {t:16.4,text:'もう一度だけ',trans:'再一次就好'},
  {t:27.0,text:'朝が来る前に',trans:'在清晨到来之前'},
  {t:30.4,text:'また会おう',trans:'再相见吧'}]},
 {title:'Paper Satellites',artist:'Low Orbit',lang:'en',end:34,lines:[
  {t:2.0,text:'Paper satellites over the bay',trans:'海湾上空的纸卫星'},
  {t:5.0,text:'Fold the night and throw it away',trans:'折起夜色 把它扔远'},
  {t:8.0,text:'Spin',trans:'旋转'},
  {t:8.6,text:'Fall',trans:'坠落'},
  {t:9.2,text:'Light it all',trans:'点亮一切'},
  {t:11.0,text:'We could burn like neon in the rain | until the morning finds our names',trans:'我们像雨里的霓虹一样燃烧 直到清晨找到我们的名字'},
  {t:16.6,text:'Stay loud',trans:'别安静下来'},
  {t:26.0,text:"Signal fades but I'm still here",trans:'信号渐弱 但我还在'},
  {t:30.0,text:'Still here',trans:'还在'}]}
];

/* ============================================================
   动效编排「浮出水面」
   每一行文字下沿有一条看不见的水面（.msk 的 overflow 裁切）。
   入场：文字从水面下 108% 处浮上来，out-expo，主句多行时自上而下错开，翻译最后浮出。
   退场：先沉翻译，再自下而上沉主句，ease-in，比入场快一倍多。
   交接：严格先出后进。旧行完全沉没后再隔 40ms，新行才开始浮出，
        两行共用同一条水面，任何时刻水面上只有一行。
   提前量：退场从下一行时间戳前 LEAD 开始，使新行恰好在时间戳附近露出。
   快歌：k = 行间隔 / 1.5s，夹在 [.42, 1]；所有时长、错开、提前量都乘 k。
   间奏：行后间隔 ≥ 6s 时，这一行停留 HOLD 后单独、缓慢地沉下（不急着腾位置），屏幕留空。
   ============================================================ */
const EZ = {
  up:   'cubic-bezier(.16,1,.3,1)',      // 浮出：快起慢停
  down: 'cubic-bezier(.6,0,.86,.4)',     // 沉下：慢起快走
  calm: 'cubic-bezier(.45,0,.75,.45)',   // 间奏退场：更平的 ease-in
};
const T = { enter: 700, exit: 300, row: 70, trans: 100, exitRow: 28, calmExit: 620, lead: .14 };
const INTERLUDE = 6, HOLD = 4.2;
/* 沉没深度按像素量：从 .in 顶到水面（.msk 下沿，含 padding）的距离，再多沉 .35em，
   盖住斜体/假名超出行框的笔画顶，保证沉到底时字形顶端在水面之下。 */
const depth = el => {
  const fs = parseFloat(getComputedStyle(el).fontSize) || 60;
  return `translateY(${Math.ceil(el.parentNode.clientHeight - el.offsetTop + .35 * fs)}px)`;
};

const lyr = document.getElementById('lyr');
const anims = new Set();
let si = 0, song = SONGS[0], time = 0, paused = false, transOn = Q.get('trans') !== '0';
let shown = null;        // {key, el}
let index = -1;

const isLat = s => !/[　-鿿＀-￯]/.test(s);
const kOf = (s, i) => {
  const L = s.lines, nt = i + 1 < L.length ? L[i + 1].t : s.end;
  return Math.min(1, Math.max(.42, (nt - L[i].t) / 1.5));
};

function anim(el, kf, dur, ease, delay = 0) {
  const a = el.animate(kf, { duration: Math.max(1, dur * SLOW), delay: delay * SLOW, easing: ease, fill: 'both' });
  anims.add(a);
  a.finished.then(() => anims.delete(a), () => anims.delete(a));
  if (paused) a.pause();
  return a;
}
const curY = el => { const m = new DOMMatrix(getComputedStyle(el).transform); return m.m42 + 'px'; };

function row(text) {
  const m = document.createElement('span'); m.className = 'msk';
  const i = document.createElement('span'); i.className = 'in';
  for (const ch of text) {
    if (ch === ' ') { i.appendChild(document.createTextNode(' ')); continue; }
    const g = document.createElement('span'); g.className = 'g'; g.textContent = ch; i.appendChild(g);
  }
  m.appendChild(i); return m;
}

/* item: {key, main:[rows], sub, lat, lang, by} */
function build(item) {
  const b = document.createElement('div');
  b.className = 'blk ' + (item.lat ? 'lat' : 'cjk');
  if (item.lang) b.lang = item.lang;
  const m = document.createElement('div'); m.className = 'm';
  item.main.forEach(t => m.appendChild(row(t)));
  b.appendChild(m);
  if (item.sub && (transOn || item.by)) addSub(b, item);
  b._item = item;
  lyr.appendChild(b);
  addWave(b);
  return b;
}
function addSub(b, item) {
  const s = document.createElement('div'); s.className = 'tr' + (item.by ? ' by' : '');
  s.appendChild(row(item.sub));
  b.querySelector('.m').appendChild(s);
  return s;
}
const mainIns = b => [...b.querySelectorAll('.m > .msk > .in')];
const subIn = b => b.querySelector('.tr .in');

/* ============================================================
   波纹「穿过」
   一道波峰从块的右缘（锚点 x=1800）往左扫过整块歌词，方向与阅读顺序相反，
   不会被读成进度。每个字在波峰到达时先抬起 A、再落下 .42A、回到原位（阻尼一次），
   A = 字号 × .095（58px 主句约 5.5px，翻译约 2.5px）。dur 1100ms、SPEED 320px/s（波长约 350px），
   同一时刻有 4~5 个相邻字在抬起，读起来是一道浪而不是单字抖动。
   字只移动，不变色、不模糊。
   水线（.wvc）常驻在整块底部，波纹经过时同一条 path 的 d 在波峰处局部隆起，
   隆起的形状与字的位移曲线逐点对应（同一组缓动、同一速度）。
   每条歌词最多两道：浮出时一道（行间隔 ≥ 1.2s；1.2~2.2s 的短行用 .6A、800ms），
   停留够长（≥ 4.6s）时中途再一道。第二道挂在歌曲时间上，暂停时不会触发；
   进行中的波纹在 anims 里，随暂停冻结；?slow 经 anim() 同样放慢。
   reduced-motion 下不出波纹，水线只随整块淡入淡出。
   ============================================================ */
const RIP = { speed: 320, dur: 1100, crest: .28, dip: .62, minEnter: 1.2, full: 2.2, minDwell: 4.6,
  small: { a: .6, dur: 800 } };
const WY = 6, WH = 10, WAMP = 3.2;   // 水线基线、容器高、隆起高度（px）
const flatD = w => `M0 ${WY} L${w} ${WY}`;
function addWave(b) {
  const c = document.createElement('div'); c.className = 'wvc';
  const sv = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); sv.setAttribute('class', 'wv');
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  sv.appendChild(p); c.appendChild(sv);
  const hv = sv.cloneNode(true); hv.setAttribute('class', 'wv hi'); c.appendChild(hv);
  b.appendChild(c);
  wavePos(b, !!b.querySelector('.tr'));
  if (document.fonts && document.fonts.status !== 'loaded')
    document.fonts.ready.then(() => b.isConnected && wavePos(b, !!b.querySelector('.tr')));
}
/* 有翻译时水线在翻译下方（整块底部），没有时在主句下方；宽度 = 主句与翻译中较宽者 */
function wavePos(b, withTr) {
  const c = b.querySelector('.wvc'); if (!c) return 0;
  const tr = withTr ? b.querySelector('.tr') : null;
  const top = tr ? tr.offsetTop + tr.offsetHeight - 2 : b.offsetHeight - 2;
  const w = Math.ceil(Math.max(b.offsetWidth, tr ? tr.offsetWidth : 0));
  const old = c.offsetTop;
  c.style.top = top + 'px'; c.style.width = w + 'px';
  c.querySelectorAll('svg').forEach(sv => {
    sv.setAttribute('width', w); sv.setAttribute('height', WH); sv.setAttribute('viewBox', `0 0 ${w} ${WH}`);
    sv.firstChild.setAttribute('d', flatD(w));
  });
  c._w = w;
  return old - top;
}
/* 波峰在 x 处的水线：与字的关键帧一一对应（空间 = 时间 × 速度）。
   波峰左侧 .28L 处开始隆起，右侧 .34L 处是 .42h 的回落，.72L 处回平。L = dur × speed。 */
function bumpD(w, x, L, h) {
  const y = WY, x0 = x - RIP.crest * L, x2 = x + (RIP.dip - RIP.crest) * L, x3 = x + (1 - RIP.crest) * L;
  const seg = (a, ya, b2, yb) => { const d = b2 - a; return `C${(a + .37 * d).toFixed(1)} ${ya} ${(a + .63 * d).toFixed(1)} ${yb} ${b2.toFixed(1)} ${yb}`; };
  const yc = (y - h).toFixed(2), yd = (y + h * .42).toFixed(2);
  return `path("M0 ${y} L${x0.toFixed(1)} ${y} ${seg(x0, y, x, yc)} ${seg(x, yc, x2, yd)} ${seg(x2, yd, x3, y)} L${w} ${y}")`;
}
/* 从左往右一道浪，走完整句的时间 = 这一句在屏上的时长 room（ms）：浪头跟着这一句的节奏走。
   浪的形状宽度固定（RIP.dur × RIP.speed ≈ 350px），速度按 room 反推。 */
function ripple(b, delay = 0, small = false, room = 0) {
  if (RM.matches || !b.isConnected || b._gone) return;
  wavePos(b, !!b.querySelector('.tr'));
  const w = b.querySelector('.wvc')._w;
  const sc = b.getBoundingClientRect().width / b.offsetWidth || 1;
  const bl = b.getBoundingClientRect().left;
  const ka = small ? RIP.small.a : 1;
  const L = RIP.speed * RIP.dur / 1000 * (small ? .8 : 1);   // 浪形宽度（px）
  const sp = (w + L) / Math.max(400, room);                   // px / ms
  const dur = L / sp;
  const e = 'cubic-bezier(.37,0,.63,1)';
  b.querySelectorAll('.g').forEach(g => {
    const r = g.getBoundingClientRect();
    const rx = ((r.left + r.width / 2) - bl) / sc;   // 离左缘的距离
    const A = Math.max(1.6, (parseFloat(getComputedStyle(g).fontSize) || 58) * .095 * ka);
    anim(g, [
      { transform: 'none', easing: e },
      { transform: `translateY(${(-A).toFixed(2)}px)`, offset: RIP.crest, easing: e },
      { transform: `translateY(${(A * .42).toFixed(2)}px)`, offset: RIP.dip, easing: e },
      { transform: 'none' }], dur, 'linear', delay + rx / sp);
  });
  /* 水线：波峰从左缘外进入、从右缘外离开，和字的位移同速 */
  const h = WAMP * ka;
  const x0 = -RIP.crest * L, x1 = w + (1 - RIP.crest) * L, T0 = (w + L) / sp;
  b.querySelectorAll('.wvc path').forEach(p => {
    const pa = anim(p, [{ d: bumpD(w, x0, L, h) }, { d: bumpD(w, x1, L, h) }], T0, 'linear', delay);
    pa.finished.then(() => pa.cancel(), () => {});   // 走完回到属性里的平直线（宽度可能已随翻译开关变化）
  });
  /* 亮斑：宽 L，中心始终对准波峰 */
  const hv = b.querySelector('.wv.hi');
  hv.style.setProperty('--spot', L + 'px');
  const ma = anim(hv, [{ maskPosition: `${x0 - L / 2}px 0`, webkitMaskPosition: `${x0 - L / 2}px 0` },
    { maskPosition: `${x1 - L / 2}px 0`, webkitMaskPosition: `${x1 - L / 2}px 0` }], T0, 'linear', delay);
  ma.finished.then(() => ma.cancel(), () => {});
}

function enter(b, k, delay, slow = 1) {
  if (RM.matches) { anim(b, [{ opacity: 0 }, { opacity: 1 }], 180, 'linear', delay); return; }
  const rows = mainIns(b), d = T.enter * Math.max(.5, k) * slow;
  rows.forEach((el, n) => anim(el, [{ transform: depth(el) }, { transform: 'none' }], d, EZ.up, delay + n * T.row * k));
  const s = subIn(b);
  if (s) anim(s, [{ transform: depth(s) }, { transform: 'none' }], d * .9, EZ.up,
    delay + (rows.length - 1) * T.row * k + T.trans * k);
  const c = b.querySelector('.wvc');
  if (c) anim(c, [{ opacity: 0 }, { opacity: getComputedStyle(c).opacity }], d * .8, 'ease-out', delay + d * .2);
}
function exit(b, dur, ease) {
  b._gone = true;
  let last;
  const done = () => b.remove();
  if (RM.matches) { last = anim(b, [{ opacity: getComputedStyle(b).opacity }, { opacity: 0 }], 140, 'linear'); }
  else {
    const c = b.querySelector('.wvc');
    if (c) anim(c, [{ opacity: getComputedStyle(c).opacity }, { opacity: 0 }], dur * .8, 'linear');
    const els = [subIn(b), ...mainIns(b).reverse()].filter(Boolean);
    els.forEach((el, n) => {
      const from = curY(el);
      el.getAnimations().forEach(a => a.cancel());
      last = anim(el, [{ transform: `translateY(${from})` }, { transform: depth(el) }], dur, ease, n * T.exitRow * Math.min(1, dur / T.exit));
    });
  }
  if (last) last.finished.then(done, done); else done();
}

/* 在 time 时刻应该显示什么 */
function desired(t) {
  const L = song.lines;
  for (let i = L.length - 1; i >= 0; i--) {
    if (t >= L[i].t - T.lead * kOf(song, i)) {
      const nt = i + 1 < L.length ? L[i + 1].t : song.end;
      if (nt - L[i].t >= INTERLUDE && t >= L[i].t + HOLD) return { key: 'gap' + i, i, none: true };
      if (i === L.length - 1 && t >= song.end - .9) return { key: 'gap' + i, i, none: true };
      const l = L[i];
      return { key: 'L' + i, i, lat: isLat(l.text), lang: song.lang, main: l.text.split('|').map(s => s.trim()), sub: l.trans };
    }
  }
  return { key: 'title', i: -1, lat: isLat(song.title), lang: song.lang, main: [song.title], sub: song.artist, by: true };
}

/* mode: 'auto' | 'seek' | 'song' | 'instant' */
function show(item, mode) {
  index = item.i;
  const old = shown && shown.el;
  const k = item.none ? 1 : mode === 'seek' ? .6 : item.i >= 0 ? kOf(song, item.i) : 1;
  let delay = 0;
  if (old) {
    if (mode === 'instant') old.remove();
    else if (item.none) exit(old, T.calmExit, EZ.calm);
    else {
      const ed = mode === 'song' ? 260 : T.exit * k;
      exit(old, ed, EZ.down);
      delay = ed + 40;
    }
  }
  if (item.none) { shown = { key: item.key, el: null }; return; }
  const b = build(item);
  shown = { key: item.key, el: b };
  if (mode !== 'instant') enter(b, k, delay, item.key === 'title' ? 1.15 : 1);
  /* 波纹排期：可见时长 = 到下一次退场（或间奏淡出）为止 */
  const L = song.lines, i = item.i;
  const t0 = i >= 0 ? L[i].t : 0, nt = i + 1 < L.length ? L[i + 1].t : (i >= 0 ? song.end : L[0].t);
  const vis = Math.min(nt - t0, i >= 0 && nt - t0 >= INTERLUDE ? HOLD : Infinity, i === L.length - 1 ? song.end - .9 - t0 : Infinity);
  /* 一句一道浪：浮出时起步，走完整句的剩余时长，和这一句同步 */
  if (mode !== 'instant' && nt - t0 >= RIP.minEnter) {
    const d0 = delay + T.enter * Math.max(.5, k) * .32;
    const room = (t0 + vis - time) * 1000 - d0 - 250;
    ripple(b, d0, nt - t0 < RIP.full, room);
  }
  b._ripT = null;
}

function setSong(n, at, mode) {
  si = (n + SONGS.length) % SONGS.length; song = SONGS[si]; time = at || 0;
  const item = desired(time);
  show(item, mode);
}

function seek(dir) {
  const L = song.lines;
  let j = index + dir;
  if (shown && shown.key.startsWith('gap') && dir > 0) j = index + 1;
  if (shown && shown.key.startsWith('gap') && dir < 0) j = index;
  if (j >= L.length) { setSong(si + 1, 0, 'song'); return; }
  time = j < 0 ? 0 : L[j].t;
  const item = desired(time);
  if (item.key !== (shown && shown.key)) show(item, 'seek');
}

/* ---------- 时钟 ---------- */
let last = performance.now();
function tick(now) {
  requestAnimationFrame(tick);
  try {
    const dt = Math.min(.25, (now - last) / 1000) / SLOW; last = now;
    if (paused) return;
    time += dt;
    if (time >= song.end) { setSong(si + 1, 0, 'song'); return; }
    const item = desired(time);
    if (!shown || item.key !== shown.key) show(item, 'auto');
    const b = shown && shown.el;
    if (b && b._ripT != null && time >= b._ripT) { if (time < b._ripT + .5) ripple(b); b._ripT = null; }
  } catch (e) { console.error(e); }
}

function setPaused(p) {
  paused = p;
  anims.forEach(a => p ? a.pause() : a.play());
  lyr.classList.toggle('paused', p);
}
function toggleTrans() {
  transOn = !transOn;
  const b = shown && shown.el;
  if (!b || b._item.by || !b._item.sub) return;
  const old = b.querySelector('.tr');
  if (!transOn && old) {
    const el = old.querySelector('.in');
    const from = curY(el); el.getAnimations().forEach(a => a.cancel());
    moveWave(b, false);
    if (RM.matches) { old.remove(); return; }
    anim(el, [{ transform: `translateY(${from})` }, { transform: depth(el) }], 240, EZ.down).finished.then(() => old.remove(), () => {});
  } else if (transOn && !old) {
    const s = addSub(b, b._item);
    if (!RM.matches) { const el = s.querySelector('.in'); anim(el, [{ transform: depth(el) }, { transform: 'none' }], 560, EZ.up); }
    moveWave(b, true);
  }
}
/* 翻译开关时水线移到新的底部：平滑滑过去，reduced-motion 下直接跳 */
function moveWave(b, withTr) {
  const dy = wavePos(b, withTr), c = b.querySelector('.wvc');
  if (c && dy && !RM.matches) anim(c, [{ transform: `translateY(${dy}px)` }, { transform: 'none' }], 300, EZ.up);
}

const CMD = {
  pause: () => setPaused(!paused),
  trans: toggleTrans,
  song: () => setSong(si + 1, 0, 'song'),
  lineNext: () => seek(1),
  linePrev: () => seek(-1),
  theme: () => { root.dataset.theme = root.dataset.theme === 'lavender' ? 'p3' : 'lavender'; },
  bg: () => { if (root.dataset.bg === 'light') delete root.dataset.bg; else root.dataset.bg = 'light'; },
};
const KEYS = { ' ': 'pause', t: 'trans', n: 'song', ArrowRight: 'lineNext', ArrowLeft: 'linePrev', l: 'theme', b: 'bg' };
addEventListener('keydown', e => {
  const c = KEYS[e.key.length === 1 ? e.key.toLowerCase() : e.key];
  if (c) { e.preventDefault(); CMD[c](); }
});
addEventListener('message', e => { const c = e.data && e.data.cmd; if (CMD[c]) CMD[c](); });

Object.defineProperty(window, '__lyr', { get: () => ({ time, index, paused, song: si, key: shown && shown.key }) });

/* ---------- 舞台缩放 ---------- */
const stage = document.getElementById('stage');
function fit() { stage.style.transform = `scale(${Math.min(innerWidth / 1920, innerHeight / 1080)})`; }
addEventListener('resize', fit); fit();

/* ---------- 开场 ---------- */
const t0 = +Q.get('t'), s0 = +Q.get('song') || 0;
if (t0 > 0) setSong(s0, t0, 'instant'); else setSong(s0, 0, 'song');
requestAnimationFrame(n => { last = n; tick(n); });
</script>
</body>
</html>
